[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commerce-intelligence"
version = "0.1.0"
description = "Agentic e-commerce market intelligence platform"
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "redis>=5.0,<6.0",
    "httpx>=0.27,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "structlog>=24.4,<26.0",
    "python-dotenv>=1.0,<2.0"
]

[project.optional-dependencies]
browser = [
    "playwright>=1.47,<2.0"
]

ai = [
    "openai>=1.50,<2.0",
    "groq>=0.11,<1.0"
]

dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0"
]

[tool.setuptools.packages.find]
include = [
    "apps*",
    "agent*",
    "scraping*",
    "normalization*",
    "analytics*",
    "intelligence*",
    "database*",
    "workflows*",
    "config*"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true