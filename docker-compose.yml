services:
  postgres:
    image: postgres:16
    container_name: commerce-intelligence-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: commerce_intelligence
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U commerce -d commerce_intelligence"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: commerce-intelligence-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data: